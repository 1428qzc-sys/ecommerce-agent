services:
  # PostgreSQL：业务表和会话表都放这里
  db:
    image: postgres:16-alpine
    container_name: ecommerce-agent-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 后端接口：FastAPI
  api:
    build: .
    container_name: ecommerce-agent-api
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      # 容器里不能用 localhost，要用 compose 的服务名 db
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ecommerce_agent
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # 前端界面：Vue 3 + Vite 打包后由 nginx 提供静态服务，/api 反向代理到后端
  web:
    build:
      context: ./frontend
    container_name: ecommerce-agent-web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
